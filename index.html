<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>The Cabinet — Skincare Routines</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:wght@400;500;600;700&family=Space+Mono&display=swap');

:root{
  --paper:#f6f1e7;
  --ink:#241f1a;
  --ink-soft:#5c5347;
  --line:#ddd3c0;
  --cleanse:#3f5346;
  --tone:#8a3b57;
  --treat:#4a3266;
  --brighten:#b0472e;
  --hydrate:#1f5a68;
  --seal:#96660f;
  --card:#fffdf8;
  --shadow:0 1px 2px rgba(36,31,26,0.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:'Source Sans 3',sans-serif;-webkit-font-smoothing:antialiased;}
body{padding-bottom:60px;}

.topbar{
  position:sticky;top:0;z-index:20;
  background:var(--paper);
  border-bottom:1px solid var(--line);
  padding:14px 16px 10px;
}
.brand{
  font-family:'Fraunces',serif;
  font-size:22px;
  font-weight:600;
  letter-spacing:0.01em;
  display:flex;align-items:baseline;gap:8px;
}
.brand .sub{
  font-family:'Space Mono',monospace;
  font-size:10px;
  color:var(--ink-soft);
  text-transform:uppercase;
  letter-spacing:0.12em;
}

.daypicker{
  display:flex;gap:6px;overflow-x:auto;
  margin-top:12px;
  padding-bottom:2px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.daypicker::-webkit-scrollbar{display:none;}
.day-btn{
  flex:0 0 auto;
  font-family:'Space Mono',monospace;
  font-size:11px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  padding:7px 12px;
  border-radius:999px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  cursor:pointer;
}
.day-btn.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.periodpicker{
  display:flex;gap:8px;margin-top:10px;
}
.period-btn{
  flex:1;
  font-family:'Fraunces',serif;
  font-size:14px;
  font-weight:500;
  padding:8px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink-soft);
  cursor:pointer;
  text-align:center;
}
.period-btn.active{
  background:var(--ink);
  color:var(--paper);
  border-color:var(--ink);
}

.cardwrap{padding:16px;max-width:640px;margin:0 auto;}
.cardhead{margin-bottom:14px;}
.theme{
  font-family:'Fraunces',serif;
  font-size:26px;
  font-weight:600;
  line-height:1.1;
}
.goal{
  font-size:13px;
  color:var(--ink-soft);
  margin-top:6px;
  line-height:1.4;
}
.goal b{
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:0.1em;
  color:var(--ink);
  margin-right:6px;
}

.rail{
  display:flex;
  gap:12px;
}
.rail-track{
  width:14px;
  flex:0 0 14px;
  position:relative;
}
.rail-line{
  position:absolute;left:6px;top:8px;bottom:8px;width:1.5px;
  background:var(--line);
}
.steps{flex:1;display:flex;flex-direction:column;gap:10px;}

.step{
  background:var(--card);
  border-radius:10px;
  border:1px solid var(--line);
  padding:11px 13px;
  box-shadow:var(--shadow);
  position:relative;
}
.step::before{
  content:'';
  position:absolute;left:-19px;top:16px;
  width:8px;height:8px;border-radius:50%;
  background:var(--dot,var(--ink-soft));
  border:2px solid var(--paper);
}
.step[data-cat="cleanse"]{--dot:var(--cleanse); border-left:3px solid var(--cleanse);}
.step[data-cat="tone"]{--dot:var(--tone); border-left:3px solid var(--tone);}
.step[data-cat="treat"]{--dot:var(--treat); border-left:3px solid var(--treat);}
.step[data-cat="brighten"]{--dot:var(--brighten); border-left:3px solid var(--brighten);}
.step[data-cat="hydrate"]{--dot:var(--hydrate); border-left:3px solid var(--hydrate);}
.step[data-cat="seal"]{--dot:var(--seal); border-left:3px solid var(--seal);}

.step-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.step-name{font-weight:600;font-size:14.5px;}
.step-tag{
  font-family:'Space Mono',monospace;
  font-size:9.5px;
  color:var(--ink-soft);
  white-space:nowrap;
  text-transform:uppercase;
  letter-spacing:0.03em;
}
.step-product{
  font-size:13.5px;
  color:var(--ink-soft);
  margin-top:4px;
  line-height:1.4;
  cursor:pointer;
  border-bottom:1px dashed transparent;
}
.step-product:active{border-bottom-color:var(--ink-soft);}
.step-note{
  font-size:12px;
  color:var(--ink-soft);
  margin-top:6px;
  line-height:1.4;
  padding-top:6px;
  border-top:1px dashed var(--line);
}
.step-note b{color:var(--ink);}

.step-controls{
  display:flex;gap:6px;
  margin-top:8px;
  padding-top:8px;
  border-top:1px dashed var(--line);
}
.step-ctrl-btn{
  font-family:'Space Mono',monospace;
  font-size:11px;
  padding:5px 9px;
  border-radius:6px;
  border:1px solid var(--line);
  background:var(--paper);
  color:var(--ink-soft);
  cursor:pointer;
}
.step-ctrl-btn:disabled{
  opacity:0.3;
  cursor:default;
}
.step-ctrl-btn:not(:disabled):active{
  background:var(--line);
}
.step-delete-btn{
  margin-left:auto;
  color:var(--tone);
  border-color:var(--tone);
}

.legend{
  display:flex;flex-wrap:wrap;gap:10px;
  margin:18px 0 6px;
  padding:10px 12px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:10px;
}
.legend-item{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-soft);font-family:'Space Mono',monospace;text-transform:uppercase;letter-spacing:0.04em;}
.legend-dot{width:7px;height:7px;border-radius:50%;}

.editbar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--card);
  border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:6px;
  z-index:30;
}
.editbtn{
  flex:1;
  font-family:'Space Mono',monospace;
  font-size:10px;
  letter-spacing:0.03em;
  text-transform:uppercase;
  padding:10px 4px;
  border-radius:8px;
  border:1px solid var(--ink);
  background:var(--ink);
  color:var(--paper);
  cursor:pointer;
  white-space:nowrap;
}
.editbtn.secondary{
  background:var(--card);
  color:var(--ink);
}

.modal-overlay{
  position:fixed;inset:0;background:rgba(36,31,26,0.5);
  z-index:40;display:none;align-items:flex-end;justify-content:center;
}
.modal-overlay.open{display:flex;}
.modal{
  background:var(--paper);
  width:100%;max-width:640px;
  border-radius:16px 16px 0 0;
  padding:18px 18px calc(18px + env(safe-area-inset-bottom));
  max-height:80vh;overflow-y:auto;
}
.modal h3{
  font-family:'Fraunces',serif;font-size:18px;font-weight:600;margin:0 0 4px;
}
.modal .modal-sub{font-size:12px;color:var(--ink-soft);margin-bottom:14px;}
.modal input, .modal select{
  width:100%;
  font-family:'Source Sans 3',sans-serif;
  font-size:15px;
  padding:10px 12px;
  border-radius:8px;
  border:1px solid var(--line);
  background:var(--card);
  color:var(--ink);
  margin-bottom:10px;
}
.modal-actions{display:flex;gap:10px;margin-top:6px;}
.modal-actions button{
  flex:1;
  font-family:'Space Mono',monospace;
  font-size:11px;letter-spacing:0.06em;text-transform:uppercase;
  padding:11px;border-radius:8px;border:1px solid var(--ink);cursor:pointer;
}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-secondary{background:transparent;color:var(--ink);}

.scope-choice{
  display:flex;flex-direction:column;gap:8px;margin-bottom:12px;
}
.scope-opt{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px;border:1px solid var(--line);border-radius:8px;
  background:var(--card);cursor:pointer;font-size:13px;
}
.scope-opt.selected{border-color:var(--ink);background:#fbf7ee;}
.scope-opt b{display:block;font-size:13px;margin-bottom:2px;}
.scope-opt span{font-size:11.5px;color:var(--ink-soft);}

.registrylist{margin-top:8px;}
.reg-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;
}
.reg-item .rcount{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-soft);}
.close-x{
  position:absolute;top:14px;right:16px;
  font-family:'Space Mono',monospace;font-size:20px;color:var(--ink-soft);
  cursor:pointer;line-height:1;
}
.footnote{
  text-align:center;font-size:11px;color:var(--ink-soft);
  margin-top:20px;font-family:'Space Mono',monospace;
}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">The Cabinet <span class="sub">Skincare Routines</span></div>
  <div class="daypicker" id="daypicker"></div>
  <div class="periodpicker" id="periodpicker"></div>
</div>

<div class="cardwrap">
  <div class="cardhead">
    <div class="theme" id="theme"></div>
    <div class="goal" id="goal"></div>
  </div>
  <div class="rail">
    <div class="rail-track"><div class="rail-line"></div></div>
    <div class="steps" id="steps"></div>
  </div>
  <div class="legend" id="legend"></div>
  <div class="footnote">Tap any product name to edit it — everywhere it appears, or just here.</div>
</div>

<div class="editbar">
  <button class="editbtn secondary" id="functionBtn">By Function</button>
  <button class="editbtn secondary" id="registryBtn">Product Index</button>
  <button class="editbtn" id="resetBtn">Reset to Default</button>
</div>

<div class="modal-overlay" id="functionOverlay">
  <div class="modal">
    <div class="close-x" id="functionClose">&times;</div>
    <h3>Browse by Function</h3>
    <div class="modal-sub">What each product actually does for your skin, grouped by job.</div>
    <div id="functionTabs" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;"></div>
    <div id="functionList"></div>
  </div>
</div>

<div class="modal-overlay" id="editOverlay">
  <div class="modal">
    <div class="close-x" id="editClose">&times;</div>
    <h3>Edit Product</h3>
    <div class="modal-sub" id="editStepLabel"></div>
    <input type="text" id="editInput" />
    <div class="scope-choice" id="scopeChoice"></div>
    <div class="modal-actions">
      <button class="btn-secondary" id="editCancel">Cancel</button>
      <button class="btn-primary" id="editSave">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="registryOverlay">
  <div class="modal">
    <div class="close-x" id="registryClose">&times;</div>
    <h3>Product Index</h3>
    <div class="modal-sub">Every product currently in use, and how many steps reference it.</div>
    <div class="registrylist" id="registryList"></div>
  </div>
</div>

const DATA_VERSION = 32; // bump this whenever DEFAULT_DATA changes, to auto-refresh stale saved copies

async function loadData(){
  try{
    const raw = localStorage.getItem('cabinet-routine-data');
    const savedVersion = parseInt(localStorage.getItem('cabinet-data-version') || '0', 10);
    if(!raw || savedVersion !== DATA_VERSION) throw new Error('stale or missing data');
    routineData = JSON.parse(raw);
  }catch(e){
    routineData = JSON.parse(JSON.stringify(DEFAULT_DATA));
    saveData(true);
  }
}
function saveData(silent){
  try{
    localStorage.setItem('cabinet-routine-data', JSON.stringify(routineData));
    localStorage.setItem('cabinet-data-version', String(DATA_VERSION));
    if(!silent) showStatus('Saved.', false);
    return true;
  }catch(e){
    console.error('save failed', e);
    if(!silent) showStatus("Couldn't save — your browser's storage may be full or blocked.", true);
    return false;
  }
}

let statusTimer = null;
function showStatus(msg, isError){
  let el = document.getElementById('statusBanner');
  if(!el){
    el = document.createElement('div');
    el.id = 'statusBanner';
    el.style.position = 'fixed';
    el.style.top = '0';
    el.style.left = '0';
    el.style.right = '0';
    el.style.zIndex = '50';
    el.style.padding = '10px 16px';
    el.style.fontFamily = "'Space Mono',monospace";
    el.style.fontSize = '12px';
    el.style.textAlign = 'center';
    document.body.appendChild(el);
  }
  el.style.background = isError ? '#7a3650' : '#3f5346';
  el.style.color = '#f6f1e7';
  el.textContent = msg;
  el.style.display = 'block';
  if(statusTimer) clearTimeout(statusTimer);
  statusTimer = setTimeout(()=>{ el.style.display = 'none'; }, 4000);
}

function renderDayPicker(){
  const el = document.getElementById('daypicker');
  el.innerHTML = '';
  DAY_ORDER.forEach(day=>{
    const b = document.createElement('button');
    b.className = 'day-btn' + (day===currentDay ? ' active':'');
    b.textContent = DAY_ABBR[day];
    b.onclick = ()=>{ currentDay = day; renderAll(); };
    el.appendChild(b);
  });
}

function renderPeriodPicker(){
  const el = document.getElementById('periodpicker');
  el.innerHTML = '';
  ['AM','PM'].forEach(p=>{
    const b = document.createElement('button');
    b.className = 'period-btn' + (p===currentPeriod ? ' active':'');
    b.textContent = p;
    b.onclick = ()=>{ currentPeriod = p; renderPeriodPicker(); renderCard(); };
    el.appendChild(b);
  });
}

function renderCard(){
  const key = CARD_KEYS[currentDay][currentPeriod];

      <div class="step-controls">
        <button class="step-ctrl-btn" data-action="up" ${isFirst ? 'disabled' : ''} aria-label="Move up">&#8593;</button>
        <button class="step-ctrl-btn" data-action="down" ${isLast ? 'disabled' : ''} aria-label="Move down">&#8595;</button>
        <button class="step-ctrl-btn step-delete-btn" data-action="delete" aria-label="Delete step">Delete</button>
      </div>
    `;
    div.querySelector('.step-product').onclick = ()=> openEdit(key, idx);
    div.querySelector('[data-action="up"]').onclick = ()=> moveStep(key, idx, -1);
    div.querySelector('[data-action="down"]').onclick = ()=> moveStep(key, idx, 1);
    div.querySelector('[data-action="delete"]').onclick = ()=> deleteStep(key, idx);
    stepsEl.appendChild(div);
  });

  renderLegend(card);
}

async function moveStep(cardKey, idx, direction){
  const steps = routineData[cardKey].steps;
  const newIdx = idx + direction;
  if(newIdx < 0 || newIdx >= steps.length) return;
  const tmp = steps[idx];
  steps[idx] = steps[newIdx];
  steps[newIdx] = tmp;
  saveData(true);
  renderCard();
}

async function deleteStep(cardKey, idx){
  const step = routineData[cardKey].steps[idx];
  if(!confirm(`Delete "${step.name}" from this routine?`)) return;
  routineData[cardKey].steps.splice(idx, 1);
  saveData(true);
  renderCard();
  showStatus('Step deleted.', false);
}

function renderLegend(card){
  const cats = [...new Set(card.steps.map(s=>s.category))];
  const order = ['cleanse','tone','brighten','treat','hydrate','seal'];
  const el = document.getElementById('legend');
  el.innerHTML = '';
  order.filter(c=>cats.includes(c)).forEach(c=>{
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `<span class="legend-dot" style="background:var(--${c})"></span>${CAT_LABEL[c]}`;
    el.appendChild(item);
  });
}

function findMatches(productText){
  // find all (cardKey, stepIdx) with an exact-match product string
  const matches = [];
  for(const key in routineData){
    routineData[key].steps.forEach((s, idx)=>{
      if(s.product === productText) matches.push({key, idx});
    });
  }
  return matches;
}

function openEdit(cardKey, stepIdx){
  editContext = {cardKey, stepIdx};
  const step = routineData[cardKey].steps[stepIdx];
  document.getElementById('editStepLabel').textContent = `${routineData[cardKey].day} ${routineData[cardKey].period} — ${step.name}`;
  document.getElementById('editInput').value = step.product;

  const matches = findMatches(step.product);
  const scopeEl = document.getElementById('scopeChoice');
  scopeEl.innerHTML = '';
  if(matches.length > 1){
    const optAll = document.createElement('div');
    optAll.className = 'scope-opt selected';
    optAll.dataset.scope = 'all';
    optAll.innerHTML = `<div><b>Update everywhere (${matches.length} steps)</b><span>This exact product appears on ${matches.length} steps across your cards. Change all of them at once.</span></div>`;
    const optOne = document.createElement('div');
    optOne.className = 'scope-opt';
    optOne.dataset.scope = 'one';
    optOne.innerHTML = `<div><b>Just this step</b><span>Only update ${routineData[cardKey].day} ${routineData[cardKey].period} — ${step.name}.</span></div>`;
    [optAll, optOne].forEach(o=>{
      o.onclick = ()=>{
        scopeEl.querySelectorAll('.scope-opt').forEach(x=>x.classList.remove('selected'));
        o.classList.add('selected');
      };
    });
    scopeEl.appendChild(optAll);
    scopeEl.appendChild(optOne);
  }

  document.getElementById('editOverlay').classList.add('open');
}

async function saveEdit(){
  const newVal = document.getElementById('editInput').value.trim();
  if(!newVal){ return; }
  const {cardKey, stepIdx} = editContext;
  const oldVal = routineData[cardKey].steps[stepIdx].product;
  const scopeEl = document.getElementById('scopeChoice');
  const selected = scopeEl.querySelector('.scope-opt.selected');
  const scope = selected ? selected.dataset.scope : 'one';

  if(scope === 'all'){
    const matches = findMatches(oldVal);
    matches.forEach(m=>{ routineData[m.key].steps[m.idx].product = newVal; });
  } else {
    routineData[cardKey].steps[stepIdx].product = newVal;
  }
  closeEdit();
  renderCard();
  const ok = await saveData();
}

function closeEdit(){
  document.getElementById('editOverlay').classList.remove('open');
  editContext = null;
}

function renderRegistry(){
  // Build usage counts by checking, for each product in the master registry,
  // how many card steps actually reference it (substring match against step text).
  const allSteps = [];
  for(const key in routineData){
    routineData[key].steps.forEach(s=> allSteps.push(s.product));
  }

  const el = document.getElementById('registryList');
  el.innerHTML = '';

  for(const category in PRODUCT_REGISTRY){
    const catHead = document.createElement('div');
    catHead.style.fontFamily = "'Space Mono',monospace";
    catHead.style.fontSize = '10px';
    catHead.style.letterSpacing = '0.08em';
    catHead.style.textTransform = 'uppercase';
    catHead.style.color = 'var(--ink-soft)';
    catHead.style.marginTop = '14px';
    catHead.style.marginBottom = '4px';
    catHead.textContent = category;
    el.appendChild(catHead);

    const products = PRODUCT_REGISTRY[category].slice().sort((a,b)=> a[0].localeCompare(b[0]));
    products.forEach(([name, tags])=>{
      const count = allSteps.filter(p => p.includes(name)).length;
      const item = document.createElement('div');
      item.className = 'reg-item';
      item.innerHTML = `<span>${name}</span><span class="rcount">${count}×</span>`;
      el.appendChild(item);
    });
  }
}

async function resetToDefault(){
  if(!confirm('Reset all routines to their original saved state? This undoes any edits you\'ve made.')) return;
  routineData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  await saveData();
  renderCard();
}

function renderAll(){
  renderDayPicker();
  renderPeriodPicker();
  renderCard();
}

document.getElementById('editClose').onclick = closeEdit;
document.getElementById('editCancel').onclick = closeEdit;
document.getElementById('editSave').onclick = saveEdit;
document.getElementById('registryBtn').onclick = ()=>{ renderRegistry(); document.getElementById('registryOverlay').classList.add('open'); };
document.getElementById('registryClose').onclick = ()=> document.getElementById('registryOverlay').classList.remove('open');
document.getElementById('resetBtn').onclick = resetToDefault;

const FUNCTION_LABELS = {
  hydrating: "Hydrating", barrier: "Barrier Repair", soothing: "Soothing",
  brightening: "Brightening / Dark Spots", firming: "Firming / Collagen",
  regenerative: "Regenerative", exfoliating: "Exfoliating",
  antioxidant: "Antioxidant", cleansing: "Cleansing", spf: "SPF"
};
let activeFunctionTag = 'hydrating';

function renderFunctionTabs(){
  const el = document.getElementById('functionTabs');
  el.innerHTML = '';
  Object.entries(FUNCTION_LABELS).forEach(([tag,label])=>{
    const b = document.createElement('button');
    b.className = 'day-btn' + (tag===activeFunctionTag ? ' active':'');
    b.textContent = label;
    b.style.fontSize = '10px';
    b.onclick = ()=>{ activeFunctionTag = tag; renderFunctionTabs(); renderFunctionList(); };
    el.appendChild(b);
  });
}

function renderFunctionList(){
  const el = document.getElementById('functionList');
  el.innerHTML = '';
  for(const category in PRODUCT_REGISTRY){
    const matches = PRODUCT_REGISTRY[category].filter(([name, tags])=> tags.includes(activeFunctionTag));
    if(matches.length === 0) continue;
    const catHead = document.createElement('div');
    catHead.style.fontFamily = "'Space Mono',monospace";
    catHead.style.fontSize = '10px';
    catHead.style.letterSpacing = '0.08em';
    catHead.style.textTransform = 'uppercase';
    catHead.style.color = 'var(--ink-soft)';
    catHead.style.marginTop = '14px';
    catHead.style.marginBottom = '4px';
    catHead.textContent = category;
    el.appendChild(catHead);
    matches.forEach(([name, tags])=>{
      const item = document.createElement('div');
      item.className = 'reg-item';
      const otherTags = tags.filter(t=>t!==activeFunctionTag).map(t=>FUNCTION_LABELS[t]).join(', ');
      item.innerHTML = `<span>${name}</span><span class="rcount">${otherTags}</span>`;
      el.appendChild(item);
    });
  }
}

document.getElementById('functionBtn').onclick = ()=>{
  renderFunctionTabs();
  renderFunctionList();
  document.getElementById('functionOverlay').classList.add('open');
};
document.getElementById('functionClose').onclick = ()=> document.getElementById('functionOverlay').classList.remove('open');

(async ()=>{
  await loadData();
  renderAll();
})();
</script>
</body>
</html>
